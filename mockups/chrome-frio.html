<!doctype html>
<!--
  MOCKUP ESTÁTICO — dirección "Chrome Frío"
  No forma parte del build de Next. Abrir directo en el navegador.

  Decisiones:
  - Un solo acento, derivado de la carátula (acá simulado: cada track trae su hex).
  - Radio lock: 12px en todo, full solo en el botón de play.
  - Sin gradient-text, sin glow, sin glass en cards. Una sola superficie elevada: el player.
  - Placeholder sin arte: tinte propio por canción, no un gradiente compartido.
-->
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mi Música — Chrome Frío (mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0b0b0c;
    --surface:#111113;
    --elevated:#17171a;
    --hair:rgba(255,255,255,.07);
    --hair-strong:rgba(255,255,255,.13);
    --text:#f4f4f5;
    --text-2:#a1a1aa;
    --text-3:#8a8a93;
    --accent:#d4d4d8;
    --r:12px;
    --sidebar:236px;
    --ease:cubic-bezier(.22,1,.36,1);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
    font-size:14px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  img{display:block;max-width:100%}
  ::selection{background:color-mix(in srgb, var(--accent) 30%, transparent)}

  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

  /* ---------- shell ---------- */
  .app{
    display:grid;
    grid-template-columns:var(--sidebar) 1fr;
    grid-template-rows:1fr auto;
    grid-template-areas:"side main" "player player";
    height:100dvh;
    overflow:hidden;
  }

  /* ---------- sidebar ---------- */
  .side{
    grid-area:side;
    background:var(--surface);
    border-right:1px solid var(--hair);
    display:flex;
    flex-direction:column;
    padding:18px 12px 12px;
    gap:22px;
    overflow-y:auto;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:0 8px}
  .brand-mark{
    width:26px;height:26px;border-radius:8px;
    background:var(--elevated);
    border:1px solid var(--hair-strong);
    display:flex;align-items:center;justify-content:center;gap:2px;
  }
  .brand-mark i{display:block;width:2px;border-radius:1px;background:var(--text-2)}
  .brand-mark i:nth-child(1){height:6px}
  .brand-mark i:nth-child(2){height:11px;background:var(--text)}
  .brand-mark i:nth-child(3){height:8px}
  .brand-name{font-size:13.5px;font-weight:600;letter-spacing:-.01em}

  .nav{display:flex;flex-direction:column;gap:1px}
  .nav-label{
    font-size:10.5px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;
    color:var(--text-3);padding:0 10px 8px;
  }
  .nav-item{
    display:flex;align-items:center;gap:10px;
    padding:8px 10px;border-radius:8px;
    color:var(--text-2);font-size:13.5px;
    transition:color .15s var(--ease),background .15s var(--ease);
    text-align:left;width:100%;
  }
  .nav-item svg{width:15px;height:15px;flex:none;opacity:.75}
  .nav-item:hover{background:rgba(255,255,255,.045);color:var(--text)}
  .nav-item:active{transform:scale(.99)}
  .nav-item[aria-current="page"]{color:var(--text);background:rgba(255,255,255,.06)}
  .nav-item[aria-current="page"] svg{opacity:1}
  .nav-item .count{margin-left:auto;font-family:'Geist Mono',monospace;font-size:11px;color:var(--text-3)}

  .side-foot{margin-top:auto;padding:10px;border-top:1px solid var(--hair);font-size:11.5px;color:var(--text-3)}

  /* ---------- main ---------- */
  .main-wrap{grid-area:main;display:flex;flex-direction:column;min-width:0;overflow:hidden}
  .topbar{
    display:flex;align-items:center;gap:12px;
    padding:12px 24px;border-bottom:1px solid var(--hair);
    flex:none;
  }
  .search{
    display:flex;align-items:center;gap:8px;
    background:var(--surface);border:1px solid var(--hair);
    border-radius:var(--r);padding:0 12px;height:36px;width:min(380px,100%);
    transition:border-color .15s var(--ease);
  }
  .search:focus-within{border-color:var(--hair-strong)}
  .search svg{width:14px;height:14px;color:var(--text-3);flex:none}
  .search input{
    background:none;border:0;outline:none;color:var(--text);
    font:inherit;font-size:13px;width:100%;
  }
  .search input::placeholder{color:var(--text-3)}
  .top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
  .icon-btn{
    width:36px;height:36px;border-radius:var(--r);
    display:grid;place-items:center;color:var(--text-2);
    transition:background .15s var(--ease),color .15s var(--ease);
  }
  .icon-btn:hover{background:rgba(255,255,255,.055);color:var(--text)}
  .icon-btn:active{transform:scale(.96)}
  .icon-btn svg{width:16px;height:16px}
  .btn-ghost{
    height:36px;padding:0 14px;border-radius:var(--r);
    border:1px solid var(--hair-strong);color:var(--text);
    display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;
    transition:background .15s var(--ease),border-color .15s var(--ease);
    white-space:nowrap;
  }
  .btn-ghost:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.2)}
  .btn-ghost:active{transform:scale(.985)}
  .btn-ghost svg{width:14px;height:14px}

  main{flex:1;overflow-y:auto;padding:28px 24px 40px}
  main::-webkit-scrollbar{width:10px}
  main::-webkit-scrollbar-thumb{background:rgba(255,255,255,.09);border-radius:99px;border:3px solid var(--bg)}
  main::-webkit-scrollbar-track{background:transparent}

  .greeting{margin-bottom:30px}
  .greeting h1{
    font-size:clamp(28px,4vw,40px);
    font-weight:600;
    letter-spacing:-.035em;
    line-height:1.06;
  }
  .greeting p{color:var(--text-2);font-size:13px;margin-top:7px}

  section{margin-bottom:34px}
  .sec-head{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
  .sec-head h2{font-size:15px;font-weight:600;letter-spacing:-.015em}
  .sec-head .n{font-family:'Geist Mono',monospace;font-size:11px;color:var(--text-3)}
  .sec-head .link{
    margin-left:auto;font-size:12px;color:var(--text-3);
    transition:color .15s var(--ease);
  }
  .sec-head .link:hover{color:var(--text)}

  /* quick play */
  .quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .quick-row{
    display:flex;align-items:center;gap:11px;
    padding:7px;border-radius:var(--r);
    border:1px solid transparent;
    text-align:left;
    transition:background .15s var(--ease),border-color .15s var(--ease);
    min-width:0;
  }
  .quick-row:hover{background:rgba(255,255,255,.045);border-color:var(--hair)}
  .quick-row:active{transform:scale(.995)}
  .quick-row .art{width:44px;height:44px;border-radius:8px;overflow:hidden;flex:none;background:var(--elevated)}
  .quick-row .art img{width:100%;height:100%;object-fit:cover;filter:saturate(.9)}
  .quick-row .txt{min-width:0;flex:1}
  .quick-row .txt p:first-child{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .quick-row .txt p:last-child{font-size:11.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .quick-row .go{
    width:28px;height:28px;border-radius:99px;flex:none;
    display:grid;place-items:center;background:rgba(255,255,255,.08);
    opacity:0;transform:translateX(-3px);
    transition:opacity .15s var(--ease),transform .15s var(--ease);
  }
  .quick-row:hover .go,.quick-row:focus-visible .go{opacity:1;transform:none}
  .quick-row .go svg{width:12px;height:12px;margin-left:1px}

  /* recent */
  .rail{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .tile{width:148px;flex:none;text-align:left}
  .tile .art{
    width:148px;height:148px;border-radius:var(--r);overflow:hidden;
    background:var(--elevated);position:relative;
    transition:transform .25s var(--ease);
  }
  .tile:hover .art{transform:translateY(-3px)}
  .tile .art img{width:100%;height:100%;object-fit:cover;filter:saturate(.9)}
  .tile .art::after{
    content:"";position:absolute;inset:0;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
    border-radius:inherit;
  }
  .tile p:first-of-type{font-size:13px;font-weight:500;margin-top:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tile p:last-of-type{font-size:11.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* list */
  .list{border-top:1px solid var(--hair)}
  .row{
    display:grid;
    grid-template-columns:30px 44px minmax(0,2fr) minmax(0,1fr) 56px;
    align-items:center;gap:12px;
    padding:8px 10px;border-radius:10px;
    width:100%;text-align:left;
    border-bottom:1px solid var(--hair);
    transition:background .12s var(--ease);
  }
  .row:hover{background:rgba(255,255,255,.035)}
  .row:active{transform:scale(.998)}
  .row .idx{
    font-family:'Geist Mono',monospace;font-size:11px;color:var(--text-3);
    display:grid;place-items:center;
  }
  .row .idx .play-glyph{display:none;width:11px;height:11px;color:var(--text)}
  .row:hover .idx .num{display:none}
  .row:hover .idx .play-glyph{display:block}
  .row .art{width:44px;height:44px;border-radius:8px;overflow:hidden;background:var(--elevated)}
  .row .art img{width:100%;height:100%;object-fit:cover;filter:saturate(.9)}
  .row .name{min-width:0}
  .row .name p:first-child{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .name p:last-child{font-size:11.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .album{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .dur{font-family:'Geist Mono',monospace;font-size:11.5px;color:var(--text-3);text-align:right}
  .row[data-playing="true"] .name p:first-child{color:var(--accent)}
  .row[data-playing="true"] .idx .num{display:none}
  .row[data-playing="true"] .idx .eq{display:inline-flex}

  .eq{display:none;gap:2px;align-items:flex-end;height:11px}
  .eq i{display:block;width:2px;background:var(--accent);border-radius:1px;transform-origin:bottom;animation:eq .85s ease-in-out infinite}
  .eq i:nth-child(1){height:60%;animation-delay:-.15s}
  .eq i:nth-child(2){height:100%;animation-delay:-.45s}
  .eq i:nth-child(3){height:75%;animation-delay:-.3s}
  @keyframes eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}

  /* ---------- player ---------- */
  .player{
    grid-area:player;
    position:relative;
    background:var(--elevated);
    border-top:1px solid var(--hair);
    z-index:20;
  }
  .progress{
    position:relative;height:3px;background:rgba(255,255,255,.07);cursor:pointer;
  }
  .progress:hover{height:5px}
  .progress .fill{height:100%;background:var(--accent);width:0%;transition:width .25s linear}
  .progress .knob{
    position:absolute;top:50%;left:0;width:10px;height:10px;border-radius:99px;
    background:var(--text);transform:translate(-50%,-50%) scale(0);
    transition:transform .15s var(--ease);
  }
  .progress:hover .knob{transform:translate(-50%,-50%) scale(1)}

  .player-inner{
    display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
    align-items:center;gap:16px;
    padding:10px 16px;
  }

  .now{display:flex;align-items:center;gap:11px;min-width:0}
  .now .art{
    width:46px;height:46px;border-radius:8px;overflow:hidden;flex:none;
    background:var(--elevated);cursor:pointer;position:relative;
  }
  .now .art img{width:100%;height:100%;object-fit:cover;filter:saturate(.9)}
  .now .art:hover::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);border-radius:inherit}
  .now .txt{min-width:0}
  .now .txt p:first-child{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .now .txt p:last-child{font-size:11.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .heart{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--text-3);flex:none;transition:color .15s var(--ease)}
  .heart:hover{color:var(--text-2)}
  .heart[aria-pressed="true"]{color:var(--accent)}
  .heart svg{width:15px;height:15px}

  .controls{display:flex;align-items:center;gap:4px}
  .ctl{
    width:34px;height:34px;border-radius:8px;display:grid;place-items:center;
    color:var(--text-2);transition:color .15s var(--ease),background .15s var(--ease);
  }
  .ctl:hover{color:var(--text);background:rgba(255,255,255,.05)}
  .ctl:active{transform:scale(.95)}
  .ctl svg{width:16px;height:16px}
  .ctl[data-on="true"]{color:var(--accent)}
  .play-btn{
    width:42px;height:42px;border-radius:99px;margin:0 4px;
    background:var(--text);color:#0b0b0c;
    display:grid;place-items:center;
    transition:transform .15s var(--ease),opacity .15s var(--ease);
  }
  .play-btn:hover{transform:scale(1.05)}
  .play-btn:active{transform:scale(.96)}
  .play-btn svg{width:17px;height:17px}

  .right{display:flex;align-items:center;justify-content:flex-end;gap:10px;min-width:0}
  .time{font-family:'Geist Mono',monospace;font-size:11px;color:var(--text-3);white-space:nowrap}
  .vol{display:flex;align-items:center;gap:6px}
  .vol input{
    -webkit-appearance:none;appearance:none;background:transparent;width:76px;height:16px;cursor:pointer;
  }
  .vol input::-webkit-slider-runnable-track{height:3px;border-radius:99px;background:rgba(255,255,255,.14)}
  .vol input::-webkit-slider-thumb{
    -webkit-appearance:none;width:9px;height:9px;border-radius:99px;background:var(--text);
    margin-top:-3px;transition:transform .15s var(--ease);
  }
  .vol input:hover::-webkit-slider-thumb{transform:scale(1.25)}
  .vol input::-moz-range-track{height:3px;border-radius:99px;background:rgba(255,255,255,.14)}
  .vol input::-moz-range-thumb{width:9px;height:9px;border:0;border-radius:99px;background:var(--text)}

  /* ---------- now playing ---------- */
  .np{
    position:fixed;inset:0;z-index:50;
    background:var(--bg);
    display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    align-items:center;gap:clamp(24px,6vw,80px);
    padding:clamp(24px,5vw,72px);
    animation:np-in .35s var(--ease);
  }
  .np[hidden]{display:none}
  @keyframes np-in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .np::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(60% 50% at 30% 45%, color-mix(in srgb, var(--accent) 9%, transparent), transparent 70%);
  }
  .np-art{
    position:relative;aspect-ratio:1;border-radius:16px;overflow:hidden;
    background:var(--elevated);justify-self:end;width:min(420px,100%);
    box-shadow:0 30px 80px -40px rgba(0,0,0,.9);
  }
  .np-art img{width:100%;height:100%;object-fit:cover;filter:saturate(.92)}
  .np-art::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);border-radius:inherit}
  .np-info{position:relative;max-width:440px}
  .np-kicker{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);font-weight:500}
  .np-info h2{font-size:clamp(26px,3.4vw,40px);font-weight:600;letter-spacing:-.035em;line-height:1.08;margin-top:12px}
  .np-info .meta{color:var(--text-2);font-size:13px;margin-top:8px}
  .np-bar{margin-top:30px}
  .np-bar .track{height:3px;background:rgba(255,255,255,.1);border-radius:99px;cursor:pointer;position:relative}
  .np-bar .track .fill{height:100%;background:var(--accent);border-radius:99px;width:0%;transition:width .25s linear}
  .np-bar .times{display:flex;justify-content:space-between;margin-top:8px;font-family:'Geist Mono',monospace;font-size:11px;color:var(--text-3)}
  .np-controls{display:flex;align-items:center;gap:6px;margin-top:18px}
  .np-controls .play-btn{width:52px;height:52px;margin:0 8px}
  .np-controls .play-btn svg{width:20px;height:20px}
  .np-controls .ctl{width:40px;height:40px}
  .np-controls .ctl svg{width:18px;height:18px}
  .np-close{
    position:absolute;top:20px;right:20px;
    width:38px;height:38px;border-radius:99px;display:grid;place-items:center;
    color:var(--text-2);border:1px solid var(--hair);background:rgba(255,255,255,.03);
    transition:background .15s var(--ease),color .15s var(--ease);
  }
  .np-close:hover{background:rgba(255,255,255,.08);color:var(--text)}
  .np-close svg{width:16px;height:16px}
  .np-viz{display:flex;align-items:flex-end;gap:3px;height:34px;margin-top:26px;opacity:.85}
  .np-viz i{display:block;width:3px;border-radius:2px;background:var(--accent);transform-origin:bottom;animation:viz 1.1s ease-in-out infinite}
  @keyframes viz{0%,100%{transform:scaleY(.2)}50%{transform:scaleY(1)}}

  /* ---------- responsive ---------- */
  @media (max-width:900px){
    .app{grid-template-columns:1fr;grid-template-areas:"main" "player"}
    .side{display:none}
    main{padding:20px 16px 28px}
    .topbar{padding:10px 16px}
    .quick{grid-template-columns:1fr}
    .row{grid-template-columns:24px 40px minmax(0,1fr) 48px}
    .row .album{display:none}
    .player-inner{grid-template-columns:minmax(0,1fr) auto;padding:9px 12px;gap:10px}
    .right{display:none}
    .np{grid-template-columns:1fr;align-content:center;gap:26px;padding:28px 20px 40px;text-align:left}
    .np-art{justify-self:center;width:min(300px,72vw)}
    .np-info{max-width:none;justify-self:center;width:100%}
  }
  @media (max-width:520px){
    .btn-ghost span{display:none}
    .btn-ghost{padding:0 10px}
    .controls .ctl:nth-child(1),.controls .ctl:nth-child(5){display:none}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<div class="app">
  <!-- ============ sidebar ============ -->
  <aside class="side">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></div>
      <span class="brand-name">Mi Música</span>
    </div>

    <nav class="nav" aria-label="Navegación principal">
      <button class="nav-item" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
        Inicio
      </button>
      <button class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg>
        Biblioteca
        <span class="count">10</span>
      </button>
      <button class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.3-7-9.2A4.1 4.1 0 0 1 12 8a4.1 4.1 0 0 1 7 2.8C19 15.7 12 20 12 20z"/></svg>
        Favoritos
        <span class="count">4</span>
      </button>
    </nav>

    <div class="nav">
      <p class="nav-label">Playlists</p>
      <button class="nav-item">Para el auto <span class="count">18</span></button>
      <button class="nav-item">Noche <span class="count">9</span></button>
      <button class="nav-item">Domingo <span class="count">23</span></button>
    </div>

    <div class="side-foot">Todo local. Nada sale de tu equipo.</div>
  </aside>

  <!-- ============ main ============ -->
  <div class="main-wrap">
    <header class="topbar">
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
        <input type="search" placeholder="Buscar por título, artista o álbum" aria-label="Buscar" />
      </label>
      <div class="top-actions">
        <button class="icon-btn" aria-label="Buscar por voz">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
        <button class="btn-ghost">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          <span>Importar</span>
        </button>
      </div>
    </header>

    <main>
      <div class="greeting">
        <h1>Buenas tardes</h1>
        <p>10 canciones en tu biblioteca</p>
      </div>

      <section>
        <div class="sec-head">
          <h2>Favoritos</h2>
          <span class="n">4</span>
          <button class="link">Ver todo</button>
        </div>
        <div class="quick" id="quick"></div>
      </section>

      <section>
        <div class="sec-head">
          <h2>Agregadas recientemente</h2>
        </div>
        <div class="rail" id="rail"></div>
      </section>

      <section>
        <div class="sec-head">
          <h2>Todas tus canciones</h2>
          <span class="n">10</span>
        </div>
        <div class="list" id="list"></div>
      </section>
    </main>
  </div>

  <!-- ============ player ============ -->
  <footer class="player">
    <div class="progress" id="progress" role="slider" aria-label="Progreso" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
      <div class="fill" id="fill"></div>
      <div class="knob" id="knob"></div>
    </div>

    <div class="player-inner">
      <div class="now">
        <button class="art" id="npArt" aria-label="Abrir vista de reproducción">
          <img id="pCover" alt="" />
        </button>
        <div class="txt">
          <p id="pTitle">—</p>
          <p id="pArtist">—</p>
        </div>
        <button class="heart" id="pHeart" aria-label="Favorito" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.3-7-9.2A4.1 4.1 0 0 1 12 8a4.1 4.1 0 0 1 7 2.8C19 15.7 12 20 12 20z"/></svg>
        </button>
      </div>

      <div class="controls">
        <button class="ctl" data-on="false" aria-label="Aleatorio">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h4l10 12h4M3 18h4L17 6h4"/><path d="M18 3l3 3-3 3M18 15l3 3-3 3"/></svg>
        </button>
        <button class="ctl" aria-label="Anterior">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 6h2v12H7zM18 6v12l-8-6z"/></svg>
        </button>
        <button class="play-btn" id="playBtn" aria-label="Reproducir">
          <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="ctl" aria-label="Siguiente">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 6h-2v12h2zM6 6v12l8-6z"/></svg>
        </button>
        <button class="ctl" data-on="false" aria-label="Repetir">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l3 3-3 3"/><path d="M20 6H8a4 4 0 0 0-4 4"/><path d="M7 21l-3-3 3-3"/><path d="M4 18h12a4 4 0 0 0 4-4"/></svg>
        </button>
      </div>

      <div class="right">
        <span class="time" id="pTime">0:00 / 0:00</span>
        <button class="ctl" aria-label="Visualizador">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 14v-4M8 18V6M12 15V9M16 19V5M20 13v-2"/></svg>
        </button>
        <div class="vol">
          <button class="ctl" aria-label="Silenciar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h3l4-4v14l-4-4H4z"/><path d="M15.5 9.5a3.5 3.5 0 0 1 0 5"/></svg>
          </button>
          <input type="range" min="0" max="1" step="0.01" value="0.7" aria-label="Volumen" />
        </div>
      </div>
    </div>
  </footer>
</div>

<!-- ============ now playing ============ -->
<div class="np" id="np" hidden>
  <button class="np-close" id="npClose" aria-label="Cerrar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>

  <div class="np-art"><img id="npCover" alt="" /></div>

  <div class="np-info">
    <p class="np-kicker">Sonando ahora</p>
    <h2 id="npTitle">—</h2>
    <p class="meta" id="npMeta">—</p>

    <div class="np-bar">
      <div class="track" id="npTrack"><div class="fill" id="npFill"></div></div>
      <div class="times"><span id="npCur">0:00</span><span id="npDur">0:00</span></div>
    </div>

    <div class="np-controls">
      <button class="ctl" data-on="false" aria-label="Aleatorio">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h4l10 12h4M3 18h4L17 6h4"/><path d="M18 3l3 3-3 3M18 15l3 3-3 3"/></svg>
      </button>
      <button class="ctl" aria-label="Anterior">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 6h2v12H7zM18 6v12l-8-6z"/></svg>
      </button>
      <button class="play-btn" id="npPlay" aria-label="Reproducir">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="ctl" aria-label="Siguiente">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 6h-2v12h2zM6 6v12l8-6z"/></svg>
      </button>
      <button class="ctl" data-on="false" aria-label="Repetir">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l3 3-3 3"/><path d="M20 6H8a4 4 0 0 0-4 4"/><path d="M7 21l-3-3 3-3"/><path d="M4 18h12a4 4 0 0 0 4-4"/></svg>
      </button>
    </div>

    <div class="np-viz" aria-hidden="true">
      <i style="height:40%;animation-delay:-.1s"></i><i style="height:70%;animation-delay:-.4s"></i>
      <i style="height:55%;animation-delay:-.2s"></i><i style="height:90%;animation-delay:-.6s"></i>
      <i style="height:35%;animation-delay:-.3s"></i><i style="height:80%;animation-delay:-.5s"></i>
      <i style="height:60%;animation-delay:-.7s"></i><i style="height:45%;animation-delay:-.25s"></i>
      <i style="height:75%;animation-delay:-.55s"></i><i style="height:30%;animation-delay:-.35s"></i>
      <i style="height:65%;animation-delay:-.15s"></i><i style="height:50%;animation-delay:-.45s"></i>
      <i style="height:85%;animation-delay:-.65s"></i><i style="height:38%;animation-delay:-.05s"></i>
      <i style="height:58%;animation-delay:-.5s"></i><i style="height:72%;animation-delay:-.3s"></i>
    </div>
  </div>
</div>

<script>
const SONGS = [
  {t:"Tren del Sur",  a:"Las Luces",  al:"Vía Lenta",    d:252, accent:"#7f9e8f", seed:"tren-del-sur",  fav:true},
  {t:"Ámbar",         a:"Nina Ferrer",al:"Vidriera",     d:208, accent:"#c08a6a", seed:"ambar-nina",    fav:true},
  {t:"Ciudad Dormida",a:"Dique 4",    al:"Panamericana", d:302, accent:"#6f86a8", seed:"ciudad-dormida",fav:true},
  {t:"Río Sucio",     a:"Camalote",   al:"Río Sucio",    d:231, accent:"#a87b8c", seed:"rio-sucio"},
  {t:"Nadie Duerme",  a:"Las Luces",  al:"Vía Lenta",    d:179, accent:"#8fa06a", seed:"nadie-duerme"},
  {t:"Bruma",         a:"El Faro",    al:"Ceniza",       d:277, accent:"#b8925f", seed:"bruma-faro",    fav:true},
  {t:"Vía Muerta",    a:"Dique 4",    al:"Panamericana", d:194, accent:"#5f8f9e", seed:"via-muerta"},
  {t:"Panamericana",  a:"Camalote",   al:"Río Sucio",    d:288, accent:"#9a8f7a", seed:"panamericana"},
  {t:"Vidriera",      a:"Nina Ferrer",al:"Vidriera",     d:213, accent:"#7a8f8a", seed:"vidriera"},
  {t:"Ceniza",        a:"El Faro",    al:"Ceniza",       d:320, accent:"#a8796a", seed:"ceniza"}
];

const cover = (s, size = 300) => `https://picsum.photos/seed/${s.seed}/${size}/${size}`;
const fmt = (n) => `${Math.floor(n / 60)}:${String(Math.floor(n % 60)).padStart(2, "0")}`;
const $ = (id) => document.getElementById(id);

const state = { i: 0, playing: false, pos: 0, timer: null };

/* ---------- render ---------- */
$("quick").innerHTML = SONGS.filter(s => s.fav).map(s => `
  <button class="quick-row" data-i="${SONGS.indexOf(s)}">
    <span class="art"><img src="${cover(s, 120)}" alt="" loading="lazy" /></span>
    <span class="txt"><p>${s.t}</p><p>${s.a}</p></span>
    <span class="go"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span>
  </button>`).join("");

$("rail").innerHTML = SONGS.slice(-6).reverse().map(s => `
  <button class="tile" data-i="${SONGS.indexOf(s)}">
    <span class="art"><img src="${cover(s, 300)}" alt="" loading="lazy" /></span>
    <p>${s.t}</p><p>${s.a}</p>
  </button>`).join("");

$("list").innerHTML = SONGS.map((s, i) => `
  <button class="row" data-i="${i}" data-playing="false">
    <span class="idx">
      <span class="num">${i + 1}</span>
      <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
      <svg class="play-glyph" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </span>
    <span class="art"><img src="${cover(s, 120)}" alt="" loading="lazy" /></span>
    <span class="name"><p>${s.t}</p><p>${s.a}</p></span>
    <span class="album">${s.al}</span>
    <span class="dur">${fmt(s.d)}</span>
  </button>`).join("");

/* ---------- accent from "cover" ---------- */
/* En la app real: canvas + getImageData sobre el <img> de la carátula.
   Acá cada track trae su hex para evitar el taint de CORS. */
function applyAccent(s) {
  document.documentElement.style.setProperty("--accent", s.accent);
}

/* ---------- selection ---------- */
function select(i) {
  state.i = i;
  state.pos = 0;
  const s = SONGS[i];
  applyAccent(s);

  $("pCover").src = cover(s, 120);
  $("pTitle").textContent = s.t;
  $("pArtist").textContent = s.a;
  $("pHeart").setAttribute("aria-pressed", String(!!s.fav));

  $("npCover").src = cover(s, 600);
  $("npTitle").textContent = s.t;
  $("npMeta").textContent = `${s.a} · ${s.al}`;
  $("npDur").textContent = fmt(s.d);

  document.querySelectorAll(".row").forEach(r =>
    r.dataset.playing = String(Number(r.dataset.i) === i));
  tick();
}

/* ---------- transport ---------- */
function setPlaying(v) {
  state.playing = v;
  const icon = v
    ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  $("playIcon").outerHTML = icon.replace("<svg", '<svg id="playIcon"');
  $("npPlay").innerHTML = icon;
  $("playBtn").setAttribute("aria-label", v ? "Pausar" : "Reproducir");
  $("npPlay").setAttribute("aria-label", v ? "Pausar" : "Reproducir");

  clearInterval(state.timer);
  if (v) {
    state.timer = setInterval(() => {
      state.pos = (state.pos + 0.25) % SONGS[state.i].d;
      tick();
    }, 250);
  }
}

function tick() {
  const s = SONGS[state.i];
  const pct = (state.pos / s.d) * 100;
  $("fill").style.width = pct + "%";
  $("knob").style.left = pct + "%";
  $("npFill").style.width = pct + "%";
  $("pTime").textContent = `${fmt(state.pos)} / ${fmt(s.d)}`;
  $("npCur").textContent = fmt(state.pos);
  $("progress").setAttribute("aria-valuenow", String(Math.round(pct)));
}

/* ---------- events ---------- */
document.querySelectorAll("[data-i]").forEach(el => {
  el.addEventListener("click", () => {
    select(Number(el.dataset.i));
    setPlaying(true);
  });
});

$("playBtn").addEventListener("click", () => setPlaying(!state.playing));
$("npPlay").addEventListener("click", () => setPlaying(!state.playing));
$("npArt").addEventListener("click", () => { $("np").hidden = false; });
$("npClose").addEventListener("click", () => { $("np").hidden = true; });

$("pHeart").addEventListener("click", () => {
  const s = SONGS[state.i];
  s.fav = !s.fav;
  $("pHeart").setAttribute("aria-pressed", String(s.fav));
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") $("np").hidden = true;
  if (e.key === " " && e.target === document.body) { e.preventDefault(); setPlaying(!state.playing); }
});

function seekFromEvent(e, el) {
  const r = el.getBoundingClientRect();
  state.pos = ((e.clientX - r.left) / r.width) * SONGS[state.i].d;
  tick();
}
$("progress").addEventListener("click", (e) => seekFromEvent(e, $("progress")));
$("npTrack").addEventListener("click", (e) => seekFromEvent(e, $("npTrack")));

/* ---------- boot ---------- */
select(0);
</script>
</body>
</html>
